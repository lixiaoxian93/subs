# 个人规则层(Clash Verge Rev 远程 Merge / 全局扩展配置)
# 作用:prepend 到机场订阅规则的最前(最高优先级),叠加在任何机场之上。
# 设计:最小覆盖 + 高价值纠偏,只做机场做得不对/不够的事,长尾交给机场。
# 全部用 mihomo 内置 geosite/geoip,零外部 rule-provider 依赖(不会因链接挂掉而断网)。
# 维护:改这个文件 → push → Clash Verge 对此 Merge 点刷新即生效。

prepend-rules:
  # ===== 1. 家庭/个人直连(回家 WG、emby、局域网,绝不进代理)=====
  - DOMAIN-SUFFIX,lxx0914.com,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve

  # ===== 2. 去广告(mihomo 内置 geosite,无外部依赖)=====
  # 嫌太激进(个别站点统计/功能受影响)就删掉这一行
  - GEOSITE,category-ads-all,REJECT

  # ===== 3. B站全系钉死直连(修 1080P 卡:大陆视频 CDN 别绕境外)=====
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,bilivideo.com,DIRECT
  - DOMAIN-SUFFIX,bilivideo.cn,DIRECT
  - DOMAIN-SUFFIX,hdslb.com,DIRECT
  - DOMAIN-SUFFIX,biliapi.net,DIRECT
  - DOMAIN-SUFFIX,biliapi.com,DIRECT
  - DOMAIN-SUFFIX,acgvideo.com,DIRECT
  - DOMAIN-SUFFIX,szbdyd.com,DIRECT
  - DOMAIN,upos-hz-mirrorakam.akamaized.net,DIRECT
  - DOMAIN-KEYWORD,upos,DIRECT
  - DOMAIN-KEYWORD,bilivideo,DIRECT
  - GEOSITE,bilibili,DIRECT

  # ===== 4. 国内全量直连(核心效率:大陆服务一律不绕境外节点)=====
  # 域名维度(fake-ip 友好,主力)
  - GEOSITE,cn,DIRECT
  # IP 维度兜底(直连 IP 的连接;fake-ip 下需真解析,故不加 no-resolve)
  - GEOIP,CN,DIRECT

  # 其余(境外该走代理的 Google/YouTube/Telegram/AI 等)继续交给机场规则处理
