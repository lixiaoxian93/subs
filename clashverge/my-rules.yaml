# 个人主路由层(Clash Verge Rev 全局扩展覆写)—— 我掌控路由,机场只当节点池
# ───────────────────────────────────────────────────────────────
# 设计(v3:去掉自建策略组,直接复用机场已有的「手动切换」做代理出口,最稳):
#   · 不再自建策略组。上版自建 🚀代理/♻️自动选择 在本机(Verge 2.4.7/mihomo 1.19.21)
#     没被创建出来 → 指向它的「国外代理」「MATCH 兜底」两条规则被整条丢弃 → 路由落回机场默认。
#   · 本版规则只引用 DIRECT 和机场已有的「手动切换」组 → 不可能因组缺失而失效。
#   · 末尾 MATCH 接管兜底 → 机场自带几百条规则全部失效,路由 100% 由本文件决定。
#   · 切节点:Clash Verge「代理」页点「手动切换」选即可(所有走代理的流量都从它出去)。
# 维护:改本文件 → push → 在「全局扩展覆写配置」重新粘贴整段 → 重启内核。
# ───────────────────────────────────────────────────────────────

# ===== 规则(顺序匹配,首条命中即生效;末尾 MATCH 接管一切)=====
prepend-rules:
  # 1) 局域网 / 本机 / 自有域名 → 直连
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lxx0914.com,DIRECT
  - GEOSITE,private,DIRECT

  # 2) B站视频 CDN 钉死直连(挂在全球 CDN 域名下,geosite:cn 漏掉,正是 1080P 卡顿根源)
  - DOMAIN-KEYWORD,upos,DIRECT
  - DOMAIN-KEYWORD,bilivideo,DIRECT
  - GEOSITE,bilibili,DIRECT

  # 3) 国内 → 直连(核心效率:大陆服务一律不绕境外节点)
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # 4) 国外 → 走机场「手动切换」组(在代理页选节点)
  - GEOSITE,geolocation-!cn,手动切换

  # 5) 兜底:漏网的(未知域名 / 直连 IP)→ 代理。此条接管后,机场自带规则全部失效。
  - MATCH,手动切换

  # 想去广告就把下面这行移到本区块最上面(域名级,拦不掉视频贴片广告;网页广告建议用 uBlock Origin):
  # - GEOSITE,category-ads-all,REJECT
